# =====================================================================
# PERFIL "prod": ajustes SÓ para produção.
# Os segredos NÃO ficam aqui: vêm de variáveis de ambiente (veja .env.example).
# =====================================================================

# ----- Email: servidores SMTP reais exigem login e conexão criptografada (STARTTLS) -----
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ----- JWT -----
# Em produção a chave privada é OBRIGATÓRIA (sem valor padrão: sem ela a aplicação não sobe).
# Uma chave temporária mudaria a cada reinício e em cada instância, invalidando os tokens.
jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}

# ----- Proxy reverso (Caddy) -----
# A aplicação fica ATRÁS do Caddy, que recebe o HTTPS. Isto faz o Spring confiar nos
# cabeçalhos X-Forwarded-* enviados pelo Caddy (IP real do cliente, https etc.).
server.forward-headers-strategy=native

# ----- Logs -----
# Logs em JSON (formato ECS): ferramentas como Grafana Loki, ELK e Datadog leem direto,
# permitindo buscar e filtrar (ex.: "todos os erros da última hora").
logging.structured.format.console=ecs
logging.level.root=INFO
