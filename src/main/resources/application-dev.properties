# =====================================================================
# PERFIL "dev": valores para rodar NA SUA MÁQUINA com o "docker compose up -d".
# Estes valores NÃO são segredos de verdade. Nunca use em produção.
# =====================================================================

# PostgreSQL do compose.yaml
spring.datasource.url=jdbc:postgresql://localhost:5432/autenticacao
spring.datasource.username=autenticacao
spring.datasource.password=autenticacao

# Mostra no console o SQL gerado (bom para aprender)
spring.jpa.show-sql=true

# Mailpit do compose.yaml (veja os emails em http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025

app.url=http://localhost:8080

# Admin criado automaticamente no ambiente de desenvolvimento
app.admin.email=admin@local.com
app.admin.password=admin12345
