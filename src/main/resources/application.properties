# =====================================================================
# CONFIGURAÇÃO COMUM (vale para todos os ambientes)
#
# Os valores no formato ${NOME_VARIAVEL} vêm de VARIÁVEIS DE AMBIENTE.
# Assim nenhuma senha/segredo de produção fica escrito no código.
#
# Perfis (profiles):
#  - "dev"  -> application-dev.properties (valores prontos para rodar local com o Docker)
#  - "test" -> src/test/resources/application-test.properties (testes automatizados)
#  - produção: rode com SPRING_PROFILES_ACTIVE=prod e defina todas as variáveis abaixo
# =====================================================================
spring.application.name=autenticacao

# Se nenhum perfil for informado, usa o "dev"
spring.profiles.default=dev

# ----- Banco de dados (PostgreSQL) -----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Quem cria/altera as tabelas é o FLYWAY (scripts em src/main/resources/db/migration).
# O Hibernate só CONFERE (validate) se as @Entity batem com as tabelas;
# se não baterem, a aplicação nem sobe, e o erro aparece logo, não em produção.
spring.jpa.hibernate.ddl-auto=validate
# Fecha a conexão com o banco ao sair do service (boa prática em APIs REST)
spring.jpa.open-in-view=false

# ----- Email (SMTP) -----
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.email.remetente=${MAIL_FROM:nao-responda@autenticacao.local}

# Endereço público da API, usado para montar os links enviados por email
app.url=${APP_URL}

# ----- JWT (RS256) -----
# Arquivo com a chave PRIVADA RSA (PEM, PKCS#8). Gere com:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
# Vazio = gera uma chave temporária ao subir (só para dev/testes).
# Formato: file:/caminho/do/arquivo.pem
jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}
# Emissor ("iss") dos tokens: a URL pública deste serviço
jwt.issuer=${app.url}
# Access token curto (15 min): se vazar, vale por pouco tempo
jwt.access-token-expiration-seconds=900
# Refresh token longo (7 dias): usado para pegar novos access tokens sem digitar a senha
jwt.refresh-token-expiration-days=7

# ----- Tokens enviados por email -----
app.token.confirmacao-email-horas=24
app.token.recuperacao-senha-minutos=30

# ----- Proteção contra força bruta no login -----
app.login.max-tentativas=5
app.login.bloqueio-minutos=15

# ----- CORS -----
# Quais sites (frontends) podem chamar esta API pelo navegador, separados por vírgula.
# Ex.: https://meusite.com,https://admin.meusite.com   (vazio = nenhum)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ----- Actuator (monitoramento) -----
# Expõe SÓ o /actuator/health (os outros endpoints mostram informações internas)
management.endpoints.web.exposure.include=health
# Não mostra detalhes (versão do banco, espaço em disco...) para quem não está autenticado
management.endpoint.health.show-details=never

# ----- Administrador inicial (opcional) -----
# Se preenchido, cria esse usuário ADMIN ao subir a aplicação (caso ainda não exista)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
