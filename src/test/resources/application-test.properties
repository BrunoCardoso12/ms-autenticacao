# =====================================================================
# PERFIL "test": usado pelos testes automatizados (@ActiveProfiles("test")).
# Usa H2 em memória: não precisa de Docker e cada execução começa com o banco limpo.
# =====================================================================
# ${random.uuid}: cada contexto de teste ganha um banco próprio (um não apaga as tabelas do outro)
# MODE=PostgreSQL: o H2 imita o PostgreSQL, para os scripts do Flyway rodarem igual
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# As tabelas são criadas pelo Flyway, igual em produção (os testes validam as migrations também)

# Nos testes o EmailService é substituído por um "mock", então nada é enviado de verdade
spring.mail.host=localhost
app.url=http://localhost:8080

app.admin.email=admin@teste.com
app.admin.password=admin12345
